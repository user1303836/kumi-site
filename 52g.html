<script>(function () { var mount = KumiShell.mount; KumiShell.mount = function (o) { return mount.call(KumiShell, Object.assign({}, o, { layout: 'bottom', font: 'roboto-mono', mono: 'roboto-mono', daws: 'marks', dawsAt: 'kicker', dawColor: 'dim', dawSize: 18, line: 1, demoStyle: 'squares', headStyle: 'one', head: 30, sub: false, headSize: 80 })); }; })();</script>
<script src="assets/r3-solid.js"></script>
<script>
(function () {
  var canvas = document.getElementById('v');
  var gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
  var playing = false, k = 0, video = null;
  var shell = KumiShell.mount({
    layout: 'bottom', theme: 'dark', font: 'geist', mono: 'geist-mono', stage: 'self',
    colors: { fg: '#e6e6e6', dim: '#8c8c8c', faint: '#5c5c5c', accent: '#ffffff', panel: 'rgba(5,5,5,0.72)', line: 'rgba(255,255,255,0.15)' },
    daws: 'marks', dawsAt: 'kicker', dawColor: 'dim', dawSize: 17,
    onDemo: function (i, d, v) { video = v; playing = true; SL.toTop(); measure(); },
    onRelease: function () { playing = false; }
  });
  if (!gl) return;
  var half = !!gl.getExtension('EXT_color_buffer_float') || !!gl.getExtension('EXT_color_buffer_half_float');
  var H = '#version 300 es\nprecision highp float;\nprecision highp sampler2D;\n';
  // The room: the camera at the origin looking down -z, the wall at z = -WALL, the projector off to the left, near us.
  // Two long drawings across the top of the wall, in wall units, on a slow clock (uT); while a demo plays one becomes the frame.
  var SCENE = [
    'uniform float uT, uK, uWall, uWhich, uS; uniform vec3 uP; uniform vec4 uRect; uniform vec2 uC;',
    'const float TAU = 6.28318530718;',
    'float pick(vec2 v) { return uWhich < 0.5 ? v.x : v.y; }',
    'vec2 rectPath(float s) {',
    '  float w = uRect.z, h = uRect.w, L = 2.0 * (w + h), d = fract(s) * L;',
    '  vec2 o = uRect.xy;',
    '  if (d < w) return o + vec2(d, 0.0);',
    '  if (d < w + h) return o + vec2(w, d - w);',
    '  if (d < 2.0 * w + h) return o + vec2(w - (d - w - h), h);',
    '  return o + vec2(0.0, h - (d - 2.0 * w - h));',
    '}',
    'vec2 figure(float s) {',
    '  float t = uT, w = uWhich;',
    '  float m = 0.5 + 0.5 * sin(t * 0.06 + w * 2.4);',
    // a flat ellipse and a long wave, slowly trading places
    '  float a = (2.9 + 0.4 * sin(t * 0.11 + w)) * pick(vec2(1.0, 0.78)), b = 0.95 + 0.3 * sin(t * 0.09 + 1.0 + w);',
    '  float th = TAU * s + t * pick(vec2(0.05, -0.07));',
    '  vec2 ell = vec2(a * cos(th), b * sin(th));',
    '  float x = (s - 0.5) * pick(vec2(7.0, 8.0));',
    '  vec2 wave = vec2(x, pick(vec2(0.8, -0.75)) * sin(TAU * pick(vec2(1.1, 1.45)) * s - t * pick(vec2(0.45, 0.62))));',
    '  vec2 f = mix(ell, wave, smoothstep(0.15, 0.85, m)) * uS;',
    '  return mix(uC + f, rectPath(s + 0.125), uK);',
    '}',
    'vec3 wallPt(vec2 w) { return vec3(w, -uWall); }'
  ].join('\n');
  var SHEET = SL.prog(gl, H + SCENE + [
    'in vec2 a; uniform mat4 uProj; out vec3 vPos; out vec3 vN; out float vR;',
    'void main() {',
    '  float s = a.x, r = a.y;',
    '  vec3 C = wallPt(figure(s)), C2 = wallPt(figure(s + 0.002));',
    '  vec3 pos = mix(uP, C, r);',
    '  vec3 ds = (C2 - C) * r, dr = C - uP;',
    '  vN = normalize(cross(ds, dr) + 1e-6);',
    '  vPos = pos; vR = r;',
    '  gl_Position = uProj * vec4(pos, 1.0);',
    '}'].join('\n'), H + [
    'in vec3 vPos; in vec3 vN; in float vR; uniform float uT, uGain; out vec4 o;',
    'float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }',
    'float noise(vec3 x) { vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);',
    '  return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x), mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),',
    '             mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x), mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z); }',
    'void main() {',
    '  vec3 v = normalize(vPos);',
    // bright where the sheet is seen edge-on, faint face-on
    '  float edge = 20.0 * pow(0.06 / (0.06 + abs(dot(v, normalize(vN)))), 1.6);',
    '  vec3 q = vPos * 1.4 + vec3(uT * 0.05, -uT * 0.03, uT * 0.02);',
    '  float haze = 0.25 + 1.3 * noise(q) * noise(q * 2.3 + 4.0) + 0.25 * noise(q * 7.0 - uT * 0.2);',
    '  float fade = smoothstep(0.02, 0.22, vR) * (0.55 + 0.45 * vR);',
    '  o = vec4(vec3(edge * haze * fade * uGain), 1.0);',
    '}'].join('\n'));
  var LINE = SL.prog(gl, H + SCENE + [
    'in vec2 a; uniform mat4 uProj;',
    'void main() { gl_Position = uProj * vec4(wallPt(figure(a.x)), 1.0); }'].join('\n'), H + [
    'uniform float uGain; out vec4 o; void main() { o = vec4(vec3(uGain), 1.0); }'].join('\n'));
  var SHOW = SL.prog(gl, H + 'in vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }', H + [
    'uniform sampler2D uLight, uVideo; uniform vec2 uRes; uniform vec4 uFrameGL; uniform vec4 uCalm[6]; uniform vec3 uCalmF[6]; uniform float uK, uT, uDpr; out vec4 o;',
    // quiet under the words and controls: rectangles in CSS px (y up) with a feather, a strength, and whether a playing demo lifts it
    'float calm(vec2 hp) {',
    '  float m = 0.0;',
    '  for (int i = 0; i < 6; i++) {',
    '    vec4 r = uCalm[i]; if (r.z <= 0.0) continue;',
    '    vec2 d = max(abs(hp - r.xy - r.zw * 0.5) - r.zw * 0.5, 0.0);',
    '    m = max(m, (1.0 - smoothstep(0.0, uCalmF[i].x, length(d))) * uCalmF[i].y * mix(1.0, 1.0 - uK, uCalmF[i].z));',
    '  }',
    '  return m;',
    '}',
    'float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }',
    'void main() {',
    '  vec2 q = gl_FragCoord.xy / uRes;',
    '  vec3 L = texture(uLight, q).rgb;',
    '  vec3 L2 = (texture(uLight, q + vec2(0.004, 0.0)).rgb + texture(uLight, q - vec2(0.004, 0.0)).rgb + texture(uLight, q + vec2(0.0, 0.006)).rgb + texture(uLight, q - vec2(0.0, 0.006)).rgb) * 0.25;',
    '  vec3 light = (L + L2 * 0.35) * (1.0 - calm(gl_FragCoord.xy / uDpr));',
    '  vec3 col = vec3(0.02) + light / (1.0 + light);',
    '  vec2 fr = (gl_FragCoord.xy - uFrameGL.xy) / uFrameGL.zw;',
    '  float inF = step(0.0, fr.x) * step(fr.x, 1.0) * step(0.0, fr.y) * step(fr.y, 1.0);',
    // the picture lands on the wall where the beam does
    '  col = mix(col, texture(uVideo, fr).rgb + light * 0.15, smoothstep(0.55, 1.0, uK) * inF);',
    '  col += (hash(gl_FragCoord.xy + fract(uT) * 31.0) - 0.5) * 0.035;',
    '  o = vec4(col, 1.0);',
    '}'].join('\n'));

  var mesh = SL.sheet(520, 52), vaoSheet = SL.vao(gl, mesh.verts, mesh.idx), NIDX = mesh.idx.length;
  var lineData = new Float32Array(1201 * 2); for (var j = 0; j <= 1200; j++) { lineData[j * 2] = j / 1200; lineData[j * 2 + 1] = 1; }
  var vaoLine = SL.vao(gl, lineData), vaoTri = SL.vao(gl, new Float32Array([-1, -1, 3, -1, -1, 3]));
  var vtex = SL.tex(gl);

  var W = 1, Hh = 1, dpr = 1, rt = null, SCALE = 0.75;
  function setup() {
    dpr = Math.min(devicePixelRatio || 1, 1.5); W = Math.round(innerWidth * dpr); Hh = Math.round(innerHeight * dpr);
    canvas.width = W; canvas.height = Hh;
    if (rt) rt.free();
    rt = SL.target(gl, Math.max(1, Math.round(W * SCALE)), Math.max(1, Math.round(Hh * SCALE)), half, 4);
    measure();
  }
  var WALL = 8, TAN = Math.tan(25 * Math.PI / 180);
  // CSS pixels to wall units, and to a point at depth z that shows at those pixels
  function toWall(px, py) { var a = innerWidth / innerHeight; return [((px / innerWidth) * 2 - 1) * TAN * a * WALL, (1 - (py / innerHeight) * 2) * TAN * WALL]; }
  function at(px, py, z) { var w = toWall(px, py); return [w[0] * z / WALL, w[1] * z / WALL, -z]; }
  var frame = { x: 0, y: 0, w: 1, h: 1 }, rectW = [0, 0, 1, 1], calmR = new Float32Array(24), calmF = new Float32Array(18), fc = [0.42, 0.33], fs = 1;
  function calms(list) {
    calmR.fill(0); calmF.fill(0);
    list.forEach(function (c, i) { if (!c[0] || i > 5) return; var b = c[0]; calmR.set([b.x, innerHeight - b.y - b.h, b.w, b.h], i * 4); calmF.set([c[1], c[2], c[3] ? 1 : 0], i * 3); });
  }
  function measure() {
    frame = SL.stage(SL.aspect(shell && shell.video));
    var p0 = toWall(frame.x, frame.y + frame.h), p1 = toWall(frame.x + frame.w, frame.y);
    rectW = [p0[0], p0[1], p1[0] - p0[0], p1[1] - p0[1]];
    var q = function (s) { return document.querySelector(s); };
    var h = SL.hero(), d = SL.box(q('.ks-demos'), 6), top = SL.box(q('.ks-top'));
    calms([[h, 80, 0.8, true], [d, 40, 0.8], [SL.box(q('.ks-foot'), 6), 30, 0.7, true], [SL.box(q('.ks-top .ks-daws'), 10), 40, 0.8]]);
    // the drawing lies across the space above the words and left of the demos
    var y0 = top ? top.y + top.h + 24 : 80, y1 = h ? h.y - 30 : innerHeight * 0.6, x1 = d ? d.x - 40 : innerWidth * 0.8;
    fc = [Math.max(0.3, Math.min(0.5, (x1 / innerWidth) * 0.52)), Math.max(0.2, ((y0 + y1) / 2) / innerHeight)];
    fs = Math.max(0.55, Math.min(1, (y1 - y0) / (innerHeight * 0.5), x1 / (innerWidth * 0.78)));
  }
  var hand = [0, 0], handTo = [0, 0], lastMove = -1e9;
  addEventListener('pointermove', function (e) { handTo = [e.clientX / innerWidth - 0.5, e.clientY / innerHeight - 0.5]; lastMove = performance.now(); }, { passive: true });

  // The slow clock: about a third of 52a's, so the drawing changes over minutes; it starts part way in.
  var clock = 40;
  SL.loop(function (t, dt) {
    var reduced = SL.reduced();
    clock += reduced ? 0 : dt * 0.35;
    var ready = playing && SL.ready(video);
    k = reduced ? (ready ? 1 : 0) : SL.approach(k, ready ? 1 : 0, ready ? 1.5 : 1.7, dt);
    if (Math.abs(k - (ready ? 1 : 0)) < 0.002) k = ready ? 1 : 0;
    if (video && (ready || k > 0) && video.readyState >= 2) SL.upload(gl, vtex, video);
    var follow = performance.now() - lastMove < 5000 && !reduced;
    hand[0] += ((follow ? handTo[0] : 0) - hand[0]) * 0.015; hand[1] += ((follow ? handTo[1] : 0) - hand[1]) * 0.015;
    var aspect = innerWidth / innerHeight;
    // the projector sits just past the top left of the view, so the sheets run long and low across the top
    var P = SL.phone() ? at(innerWidth * -0.1, innerHeight * 0.07, 5.0) : at(innerWidth * (-0.1 + hand[0] * 0.1), innerHeight * (0.05 + Math.max(0, hand[1]) * 0.1), 5.0);
    var cw = SL.phone() ? toWall(innerWidth * 0.52, innerHeight * 0.2) : toWall(innerWidth * fc[0], innerHeight * fc[1]);
    var proj = SL.persp(aspect, TAN);
    gl.bindFramebuffer(gl.FRAMEBUFFER, rt.fb); gl.viewport(0, 0, rt.w, rt.h);
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    function common(P_) {
      gl.uniform1f(P_.u.uT, clock); gl.uniform1f(P_.u.uK, k); gl.uniform1f(P_.u.uWall, WALL); gl.uniform1f(P_.u.uS, SL.phone() ? toWall(innerWidth * 0.95, 0)[0] / 4.0 : fs);
      gl.uniform3fv(P_.u.uP, P); gl.uniform4fv(P_.u.uRect, rectW); gl.uniform2fv(P_.u.uC, cw); gl.uniformMatrix4fv(P_.u.uProj, false, proj);
    }
    gl.useProgram(SHEET.p); gl.bindVertexArray(vaoSheet); common(SHEET);
    [0.075, 0.06].forEach(function (gain, which) {
      gl.uniform1f(SHEET.u.uWhich, which);
      gl.uniform1f(SHEET.u.uGain, 1.4 * gain * (1 - 0.6 * k) * (which ? 1 - k : 1));
      gl.drawElements(gl.TRIANGLES, NIDX, gl.UNSIGNED_INT, 0);
    });
    gl.useProgram(LINE.p); gl.bindVertexArray(vaoLine); common(LINE);
    [1.2, 0.9].forEach(function (gain, which) {
      gl.uniform1f(LINE.u.uWhich, which); gl.uniform1f(LINE.u.uGain, gain * (1 - k * (which ? 1 : 0.4)));
      gl.drawArrays(gl.LINE_STRIP, 0, 1201);
    });
    gl.disable(gl.BLEND);
    rt.resolve();
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, Hh);
    gl.useProgram(SHOW.p); gl.bindVertexArray(vaoTri);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, rt.tex); gl.uniform1i(SHOW.u.uLight, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, vtex); gl.uniform1i(SHOW.u.uVideo, 1);
    gl.uniform2f(SHOW.u.uRes, W, Hh);
    gl.uniform4f(SHOW.u.uFrameGL, frame.x * dpr, (innerHeight - frame.y - frame.h) * dpr, frame.w * dpr, frame.h * dpr);
    gl.uniform4fv(SHOW.u.uCalm, calmR); gl.uniform3fv(SHOW.u.uCalmF, calmF);
    gl.uniform1f(SHOW.u.uK, k); gl.uniform1f(SHOW.u.uT, reduced ? 0 : t); gl.uniform1f(SHOW.u.uDpr, dpr);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.activeTexture(gl.TEXTURE0);
  });
  setup();
  addEventListener('resize', setup);
  shell.video.addEventListener('loadedmetadata', measure);
  shell.root.addEventListener('transitionend', measure);
  addEventListener('scroll', measure, { passive: true });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(measure);
  setTimeout(measure, 300);
})();
</script>
