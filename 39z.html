<style>
  html, body { margin: 0; height: 100%; background: #000; }

  #cloud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

</style>

<body>
<canvas id="cloud" aria-hidden="true"></canvas>
<script src="assets/kumi.js"></script>
<script>
// The live page's DAW footage (Ableton or Renoise here: REAPER's clip needs its white plug-in windows skipped) at a random
// moment. These backgrounds were first built from demo clips that aren't public yet.
window.KumiFootage = function (opts) {
  var v = KUMI.video({ src: new URL('media/cloud-' + (Math.random() < 0.5 ? 'ableton' : 'renoise') + '.mp4', location.href).href }, opts);
  v.addEventListener('loadedmetadata', function () { v.currentTime = Math.random() * v.duration; }, { once: true });
  return v;
};
</script>
<script src="assets/shell.js"></script>
<script>(function () { var mount = KumiShell.mount; KumiShell.mount = function (o) { return mount.call(KumiShell, Object.assign({}, o, { layout: 'bottom', font: 'roboto-mono', mono: 'roboto-mono', daws: 'marks', dawsAt: 'kicker', dawColor: 'dim', dawSize: 18, line: 1, demoStyle: 'squares', headStyle: 'one', head: 30, sub: false, headSize: 80 })); }; })();</script>
<script type="module">
import * as THREE from 'three';

const K = window.KUMI, RM = K.reducedMotion();
const LAYOUT = 'bottom';
THREE.ColorManagement.enabled = false;  // hex colours and video values pass straight to the screen

// Two sources: a quiet looping demo for the idle cloud, and the shell's video when a demo is picked.
function hide(v) { v.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none'; document.body.appendChild(v); return v; }
const ambient = hide(KumiFootage({ autoplay: !RM, preload: 'auto', poster: false }));
ambient.playbackRate = 1;
ambient.addEventListener('play', () => { ambient.playbackRate = 1; });
// The stretches of the ambient demo to stay within (its typed prompt and end screen are nearly black), or null.
const SKIP = null;
function stayLit() {
  if (!SKIP || ambient.readyState < 1 || ambient.seeking) return;
  const ct = ambient.currentTime;
  if (SKIP.some((s) => ct >= s[0] && ct < s[1])) return;
  ambient.currentTime = (SKIP.find((s) => s[0] > ct) || SKIP[0])[0];
}
ambient.addEventListener('loadedmetadata', stayLit);
const hooks = { daw() {} };
const shell = KumiShell.mount({
  layout: LAYOUT, theme: 'dark', font: 'inter-tight', mono: 'spline',
  colors: { accent: '#7d93ff' }, stage: 'self',
  daws: 'marks', dawsAt: 'kicker', dawColor: 'dim', dawSize: 18, line: 1, demoStyle: 'bright',
  onDaw: (i, daw) => hooks.daw(i, daw),
  onDemo: (i, d, video) => { if (!video.parentNode) hide(video); want = 1; ambient.pause(); },
  onRelease: () => { want = 0; if (!RM) ambient.play().catch(() => {}); }
});
const texA = new THREE.VideoTexture(ambient), texB = new THREE.VideoTexture(shell.video);
[texA, texB].forEach((t) => { t.colorSpace = THREE.NoColorSpace; t.minFilter = THREE.LinearFilter; t.generateMipmaps = false; });

const cv = document.getElementById('cloud');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: false, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
renderer.setClearColor(0x000000, 1);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, 1, 0.05, 60);

const NX = 640, NY = 360, LAYERS = 1, N = NX * NY * LAYERS;
const uvp = new Float32Array(N * 2), rnd = new Float32Array(N), lay = new Float32Array(N);
for (let L = 0, k = 0; L < LAYERS; L++) for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++, k++) {
  uvp[k * 2] = (i + Math.random()) / NX; uvp[k * 2 + 1] = (j + Math.random()) / NY; rnd[k] = Math.random(); lay[k] = L;
}
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
geo.setAttribute('uvp', new THREE.BufferAttribute(uvp, 2));
geo.setAttribute('rnd', new THREE.BufferAttribute(rnd, 1));
geo.setAttribute('layer', new THREE.BufferAttribute(lay, 1));
geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 20);

const U = {
  uA: { value: texA }, uB: { value: texB }, uMix: { value: 0 }, uFlat: { value: 0 },
  uAspect: { value: 16 / 9 }, uDepth: { value: 1.3 }, uScan: { value: -1 }, uFocus: { value: 3 }, uView: { value: 900 }, uT: { value: 0 }, uCell: { value: 2 }
};
const PRELUDE = `
  attribute vec2 uvp; attribute float rnd; attribute float layer;
  uniform sampler2D uA, uB; uniform float uMix, uFlat, uAspect, uDepth, uScan, uFocus, uView, uT, uCell;
  uniform vec4 uClear; uniform vec4 uClear2; uniform float uClearAmt; uniform float uFeather; uniform vec2 uVPx;
  vec3 src(vec2 uv) { return mix(texture2D(uA, uv).rgb, texture2D(uB, uv).rgb, uMix); }
  float luma(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
  float boxDist(vec4 b, vec2 p) {
    float dx = max(b.x - p.x, p.x - b.z), dy = max(b.y - p.y, p.y - b.w);
    return length(max(vec2(dx, dy), 0.0)) + min(max(dx, dy), 0.0);
  }
  // Near the words (and the demo list) points thin out: fewer of them, not dimmer ones,
  // so faint additive points never round to odd colours.
  float clearKeep(vec4 clip) {
    if (uClearAmt <= 0.0) return 1.0;
    vec2 px = (clip.xy / clip.w * 0.5 + 0.5) * uVPx;
    float m = min(smoothstep(0.0, uFeather, boxDist(uClear, px)), smoothstep(0.0, uFeather * 1.6, boxDist(uClear2, px)));
    return step(fract(rnd * 61.7 + 0.37), mix(1.0, m, uClearAmt));
  }
`;
const FPRELUDE = ``;
U.uClear = { value: new THREE.Vector4(-9, -9, -8, -8) }; U.uClear2 = { value: new THREE.Vector4(-9, -9, -8, -8) }; U.uClearAmt = { value: 0 }; U.uFeather = { value: 60 }; U.uVPx = { value: new THREE.Vector2(1, 1) };
const mat = new THREE.ShaderMaterial({
  uniforms: U, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: PRELUDE + `
    varying vec3 vCol; varying float vA; varying float vLit; varying float vTone;
    float h31(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
    float vn3(vec3 x) {
      vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(mix(h31(i), h31(i + vec3(1, 0, 0)), f.x), mix(h31(i + vec3(0, 1, 0)), h31(i + vec3(1, 1, 0)), f.x), f.y),
                 mix(mix(h31(i + vec3(0, 0, 1)), h31(i + vec3(1, 0, 1)), f.x), mix(h31(i + vec3(0, 1, 1)), h31(i + vec3(1, 1, 1)), f.x), f.y), f.z);
    }
    void main() {
      vec3 c = src(uvp);
      float l = luma(c), chroma = length(c - vec3(l));
      float dens = max(pow(smoothstep(0.05, 0.7, l), 0.8), smoothstep(0.12, 0.3, chroma) * 0.9);
      float keep = mix(step(rnd, dens), 1.0, uFlat);
      float z = pow(l, 1.15) * uDepth - 0.25;
      vec3 p = vec3((uvp.x - 0.5) * uAspect, uvp.y - 0.5, z * (1.0 - uFlat));
      // Light in slow, uneven patches that drift and change shape; nothing sweeps.
      float n = vn3(vec3(p.xy * 1.6, uT * 0.07)) * 0.65 + vn3(vec3(p.xy * 3.7 + 5.0, uT * 0.11)) * 0.35;
      float lit = 0.2 + 0.72 * smoothstep(0.45, 0.85, n);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      keep *= clearKeep(gl_Position);
      float dist = -mv.z;
      float coc = abs(dist - uFocus) * 2.0 * (1.0 - uFlat);
      float idleSize = (0.9 + 1.6 * l + coc * 4.0) * (uView / 1000.0) * (3.0 / dist);
      gl_PointSize = mix(idleSize, uCell, uFlat) * keep;
      vA = keep * mix(lit, 1.0, uFlat) / (1.0 + coc * coc * 5.0);
      vCol = c; vLit = lit; vTone = smoothstep(0.1, 0.8, l);
    }`,
  fragmentShader: FPRELUDE + `
    uniform float uFlat;
    varying vec3 vCol; varying float vA; varying float vLit; varying float vTone;
    void main() {
      vec2 q = gl_PointCoord - 0.5;
      float d = length(q);
      float a = mix(smoothstep(0.5, 0.15, d), 1.0 - step(0.5, max(abs(q.x), abs(q.y))), uFlat) * vA;
      if (a <= 0.001) discard;
      vec3 mono = vec3(0.92, 0.93, 0.95) * (0.7 + 1.3 * vTone);
      gl_FragColor = vec4(mix(mono, vCol, uFlat), a * mix(0.9, 0.55, uFlat));
    }`
});
const cloud = new THREE.Points(geo, mat);
scene.add(cloud);

// When the picture has formed, the picture itself takes over, crisp.
const screenMat = new THREE.MeshBasicMaterial({ map: texB, transparent: true, opacity: 0, depthWrite: false });
const screen = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), screenMat);
screen.renderOrder = 2;
scene.add(screen);

// The view is the page's own: it can't be dragged; at irregular moments it glides to a new angle.
let az = -0.55, el = 0.3, tAz = az, tEl = el, idle = 9, dragging = null;
const GLIDE = { az: [-0.85, 0.25], el: [0.15, 0.4] };
let gFrom = [az, el], gTo = [az, el], gT = 1, gDur = 3, nextGlide = 3 + Math.random() * 4;

const mobile = () => innerWidth <= 820;
function size() {
  const w = cv.clientWidth, h = cv.clientHeight;
  renderer.setSize(w, h, false);
  U.uView.value = h * renderer.getPixelRatio();
  camera.aspect = w / Math.max(1, h);
  camera.fov = camera.aspect < 1 ? 50 : 34;
}
addEventListener('resize', size); size();

// The shell's boxes, for fitting the cloud into the free space.
const heroEl = shell.root.querySelector('.ks-hero'), listEl = shell.root.querySelector('.ks-demos');
// Centre the cloud on (cx, cy) with its width about fw px.
function fit(cx, cy, fw) {
  const w = innerWidth, h = innerHeight, tan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const aspect = U.uAspect.value || 16 / 9;
  return { x: w / 2 - cx, y: h / 2 - cy, dist: aspect * h / (2 * tan * Math.max(80, fw)) };
}
// Where the cloud sits while idle, and where the picture lands when flat (css px offsets of the view).
// The words' real extent (the hero box is wider than its text).
function textBox() {
  const r = document.createRange(), boxes = [];
  ['.ks-h1', '.ks-sub'].forEach((sel) => { const e = heroEl.querySelector(sel); if (e) { r.selectNodeContents(e); boxes.push(r.getBoundingClientRect()); } });
  const ins = heroEl.querySelector('.ks-install'); if (ins) boxes.push(ins.getBoundingClientRect());
  const dw = heroEl.querySelector('.ks-daws'); if (dw) { const b = dw.getBoundingClientRect(); if (b.width) boxes.push(b); }
  return { left: Math.min(...boxes.map((b) => b.left)), right: Math.max(...boxes.map((b) => b.right)), top: Math.min(...boxes.map((b) => b.top)), bottom: Math.max(...boxes.map((b) => b.bottom)) };
}
function idleView() {
  const H = heroEl.getBoundingClientRect(), L = listEl.getBoundingClientRect(), T = textBox();
  const w = innerWidth, h = innerHeight;
  if (mobile()) return { x: 0, y: h * 0.3, dist: 4.0 };
  return fit(Math.min(L.left - 30, w * 0.9) * 0.5, (100 + T.top - 20) / 2, Math.min(w * 0.78, (T.top - 80) * (U.uAspect.value || 1.78) * 0.95));
}
function flatView(aspect) {
  const w = innerWidth, h = innerHeight;
  const fw = Math.min(w * (mobile() ? 0.94 : 0.66), h * (mobile() ? 0.9 : 1.1) * aspect), fh = fw / aspect;
  const c = mobile() ? [w / 2, h * 0.42] : [w * 0.45, h * 0.5];
  const dist = h / (fh * 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  return { x: w / 2 - c[0], y: h / 2 - c[1], dist, fw };
}

let want = 0, f = 0, fVel = 0, mix = 0, t = 0, flowT = 0, speed = 1;
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  if (document.hidden) return;
  const dt = Math.min(0.05, clock.getDelta());
  if (!want) stayLit();
  t += dt; idle += dt;
  // The flatten is a critically damped spring: deliberate on the way in, quick on the way out.
  if (RM) { f = want ? 1 : 0; fVel = 0; }
  else {
    const k = want ? 9 : 38, c = 2 * Math.sqrt(k);
    fVel += (k * ((want ? 1 : 0) - f) - c * fVel) * dt;
    f = Math.min(1, Math.max(0, f + fVel * dt));
  }
  mix += ((want ? 1 : 0) - mix) * Math.min(1, dt * (want ? 8 : 1.6));
  U.uFlat.value = f; U.uMix.value = mix;
  const va = ambient.videoWidth ? ambient.videoWidth / ambient.videoHeight : 16 / 9;
  const vb = shell.video.videoWidth ? shell.video.videoWidth / shell.video.videoHeight : va;
  const aspect = va + (vb - va) * mix;
  U.uAspect.value = aspect;
  // A glide: from where the view is to a new angle, eased in and out; then it holds until the next one.
  if (!RM && !want && t > nextGlide) {
    gFrom = [tAz, tEl];
    let a = tAz;
    for (let i = 0; i < 24 && Math.abs(a - tAz) < 0.35; i++) a = GLIDE.az[0] + Math.random() * (GLIDE.az[1] - GLIDE.az[0]);
    gTo = [a, GLIDE.el[0] + Math.random() * (GLIDE.el[1] - GLIDE.el[0])];
    gT = 0; gDur = 2.4 + Math.random() * 1.4;
    nextGlide = t + gDur + 3 + Math.pow(Math.random(), 1.3) * 10;
  }
  if (gT < 1) {
    gT = Math.min(1, gT + dt / gDur);
    const e = gT * gT * gT * (gT * (gT * 6 - 15) + 10);
    tAz = gFrom[0] + (gTo[0] - gFrom[0]) * e; tEl = gFrom[1] + (gTo[1] - gFrom[1]) * e;
  }
  az += (tAz - az) * Math.min(1, dt * 6); el += (tEl - el) * Math.min(1, dt * 6);
  const iv = idleView(), fv = flatView(aspect);
  const A = az * (1 - f), E = el * (1 - f);
  const R = iv.dist + (fv.dist - iv.dist) * f;
  camera.position.set(Math.sin(A) * Math.cos(E) * R, Math.sin(E) * R, Math.cos(A) * Math.cos(E) * R);
  camera.lookAt(0, 0, 0.15 * (1 - f));
  const w = cv.clientWidth, h = cv.clientHeight;
  camera.setViewOffset(w, h, iv.x + (fv.x - iv.x) * f, iv.y + (fv.y - iv.y) * f, w, h);
  camera.updateProjectionMatrix();
  U.uFocus.value = R - 0.15;
  U.uCell.value = (fv.fw / NX) * renderer.getPixelRatio() * 1.6;
  speed = 1;
  flowT += dt * (RM ? 0 : speed);
  U.uT.value = flowT;
  if (true || true) {
    const pr = renderer.getPixelRatio(), pad = 16;
    if (true) { const T = textBox(); U.uClear.value.set((T.left - pad) * pr, (h - T.bottom - pad) * pr, (T.right + pad) * pr, (h - T.top + pad) * pr); }
    else U.uClear.value.set(-9e4, -9e4, -8e4, -8e4);
    if (true) { const Lr = listEl.getBoundingClientRect(); U.uClear2.value.set((Lr.left - 12) * pr, (h - Lr.bottom - 12) * pr, (Lr.right + 12) * pr, (h - Lr.top + 12) * pr); }
    else U.uClear2.value.set(-9e4, -9e4, -8e4, -8e4);
    U.uFeather.value = 70 * pr;
    U.uVPx.value.set(w * pr, h * pr);
    U.uClearAmt.value = 1 - f;
  } else U.uClearAmt.value = 0;

  screen.scale.set(aspect, 1, 1);
  screenMat.opacity = Math.max(0, (f - 0.8) / 0.2);
  if (shell.video.readyState >= 2) texB.needsUpdate = true;
  renderer.render(scene, camera);
});
</script>
