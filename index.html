<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const K = window.KUMI, RM = K.reducedMotion();
const LAYOUT = 'bottom';

// Two sources: footage of the DAWs at work for the idle cloud, and the shell's video when a demo is picked.
function hide(v) { v.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none'; document.body.appendChild(v); return v; }
// The cloud is built from footage of the DAWs at work, turning slowly from one into the next: a long hold on each,

const SOURCES = [
  { src: 'media/cloud-ableton.mp4' },
  { src: 'media/cloud-reaper.mp4', keep: [[8.2, 13.3], [16.8, 54.6]] },   // skips the white plugin windows
  { src: 'media/cloud-renoise.mp4' }
];
const abs = (u) => new URL(u, location.href).href;
// The page opens on a random one of them at a random moment, and each one it turns into starts at a random moment too.
const pickSource = (not) => { const c = SOURCES.map((x, i) => i).filter((i) => !not.includes(i)); return c[Math.floor(Math.random() * c.length)]; };

    for (const x of k) { if (r < x[1] - x[0]) { v.currentTime = x[0] + r; return; } r -= x[1] - x[0]; }

const screen = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), screenMat);

scene.add(screen);

// another random one (never too close to the last), at a random pace.

const mobile = () => innerWidth <= 820;
// Glow: only the brightest points bleed a little light. It fades out while a demo plays, so the video stays clean.
// The passes render in half-float, so faint additive points also stay true to colour.
const BLOOM = (() => { const q = new URLSearchParams(location.search); return { strength: +(q.get('glow') || 0.32), radius: +(q.get('glowr') || 0.45), threshold: +(q.get('glowt') || 0.62) }; })();

const FOG = (() => { const q = new URLSearchParams(location.search); return q.has('fog') ? +q.get('fog') : 0.8; })();

// The fog's band follows the view: from a third of the way into the cloud's depth (as seen from the camera) to its far
// side, so it works from any angle: head-on the dim far points sink, from the side the far end does.

composer.addPass(bloom);

  const w = cv.clientWidth, h = cv.clientHeight;

  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h);

}

// Centre the cloud on (cx, cy) with its width about fw px.

// Where the cloud sits while idle, and where the picture lands when flat (css px offsets of the view).
