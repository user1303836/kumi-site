<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kumi · an AI agent in your DAW</title>
<meta name="description" content="A free, open-source AI agent that works inside Ableton Live, REAPER and Renoise. Ask for the sound in your head, a mix like a track you love, or the patch from a tutorial: Kumi builds it in your project and listens until it’s right.">
<meta name="theme-color" content="#09090a">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Kumi · an AI agent in your DAW">
<meta property="og:description" content="A free, open-source AI agent that works inside Ableton Live, REAPER and Renoise. Ask for the sound in your head, a mix like a track you love, or the patch from a tutorial: Kumi builds it in your project and listens until it’s right.">
<meta property="og:image" content="https://kumi-agent.com/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://kumi-agent.com/">
<meta property="og:url" content="https://kumi-agent.com/">
<link rel="stylesheet" href="assets/shell.css">
<style>html, body { margin: 0; height: 100%; background: #09090a; overflow: hidden; } #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }  .ks-demos, .ks-now { display: none !important; }
</style>
</head>
<body>
<canvas id="c" aria-label="A strange attractor made of a million points"></canvas>
<script src="assets/kumi.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/r6-attractor.js"></script>
<script>
(function () {
  var wide = function () { return innerWidth > 820; };
  var flat = 0;
  var home = [0.08, 0.36], stage = [0, 0.02];
  // What was chosen (2026-10-29): the five invented shapes in a shuffled order, at the slowest pace, through a macro lens
  // whose thin slice of focus drifts slowly through the shape, each morph lingering in its amorphous middle. The tables
  // keep the other choices for trying: ?shapes=, ?pace=, ?lens=, ?between=.
  var SHAPES = ['aizawa', 'thomas', 'halvorsen', 'dadras', 'chen', 'fourwing', 'lorenz', 'rossler', 'threescroll', 'lorenz84',
    'shimizu', 'burkeshaw', 'hadley', 'lorenzmod2', 'halvorsen14'];
  var INVENTED = ['rose', 'cup', 'manta', 'smoke', 'flame'];   // made-up flows, not from the literature
  var SHAPE_SETS = { all: SHAPES.concat(INVENTED), classic: SHAPES, invented: INVENTED };
  var PACES = {
    slow: { flow: 0.5, spin: 0.045, holds: [8, 16], morphs: [7, 12] },
    slower: { flow: 0.3, spin: 0.03, holds: [10, 20], morphs: [10, 16] },
    slowest: { flow: 0.18, spin: 0.018, holds: [12, 24], morphs: [14, 22] },
    glacial: { flow: 0.07, spin: 0.007, holds: [20, 40], morphs: [30, 50] },
    geologic: { flow: 0.025, spin: 0.0025, holds: [40, 80], morphs: [70, 120] }
  };
  // Lenses: rectilinear ones by field of view, the camera pulled in closer the wider they get; fisheyes
  // map the angle from the axis (diag: degrees to the frame's corner); macro focuses on a thin slice that drifts slowly
  // through the shape. ?lens= any of these.
  var LENSES = {
    normal: {},
    wide: { fov: 1.745, dist: 0.8, near: 0.02 },
    ultrawide: { fov: 2.27, dist: 0.5, near: 0.02 },
    fisheye: { proj: 1, diag: 100, dist: 0.8 },
    inside: { proj: 2, diag: 135, dist: 0.12 },
    telephoto: { fov: 0.1396, dist: 16.7 },
    macro: { dist: 2.6, aperture: 7, maxGrow: 10, focusDrift: 0.5, focusRate: 0.04 }
  };
  // The in-between, where one shape has let go and the next hasn't formed: brief (the plain morph), linger (half of each
  // morph drifts slowly through its amorphous middle) or dwell (shorter holds, longer morphs, mostly in-between, a little
  // looser). ?between= any of these.
  var BETWEENS = {
    brief: {},
    linger: { linger: 0.5, span: 0.15 },
    dwell: { linger: 0.7, span: 0.2, haze: 0.12, holds: 0.5, morphs: 1.5 }
  };

  var SHAPES_DEFAULT = 'invented', PACE_DEFAULT = 'slowest', LENS_DEFAULT = 'macro', BETWEEN_DEFAULT = 'linger';

  var q = new URLSearchParams(location.search);
  var pace = PACES[q.get('pace')] || PACES[PACE_DEFAULT], lens = LENSES[q.get('lens')] || LENSES[LENS_DEFAULT];
  var between = BETWEENS[q.get('between')] || BETWEENS[BETWEEN_DEFAULT];
  var scale = function (r, k) { return [r[0] * (k || 1), r[1] * (k || 1)]; };
  var only = SHAPE_SETS[q.get('shapes') || SHAPES_DEFAULT] || (q.get('shapes') || '').split(',').filter(function (n) { return SHAPE_SETS.all.indexOf(n) >= 0; });
  var a = KumiAttractor(document.getElementById('c'), {
    bg: [0.035, 0.035, 0.04], blend: 'add', ink: 'depth', color: [0.95, 0.93, 0.88], color2: [0.25, 0.25, 0.3], alpha: 0.05, pointSize: 1.3,
    sequence: only.length ? only : SHAPE_SETS.invented, shuffle: true, rhythm: 'custom',
    holds: scale(pace.holds, between.holds), morphs: scale(pace.morphs, between.morphs),
    linger: between.linger, lingerSpan: between.span, haze: between.haze,
    flow: pace.flow, spin: pace.spin, lens: lens, drag: false,
    size: function () { return wide() ? 1.25 : 0.7; },   // smaller on a phone, where the shapes ran off the sides
    // a hovered DAW logo gathers out of the points very slowly (about 20 s), the shape still turning behind it
    logoSize: 0.8, logoAlpha: 0.6, rimPx: 2, logoShare: 0.6, logoRim: 0.24, logoStay: 0.85, morphWhileLogo: true,
    formRate: 0.12, releaseRate: 0.3, slotRate: 0.2,
    center: function () { var h = wide() ? home : [0, 0.28]; return [h[0] + (stage[0] - h[0]) * flat, h[1] + (stage[1] - h[1]) * flat]; }
  });
  window.__attractor = a;
  var target = 0;
  (function ease() { flat += (target - flat) * 0.06; requestAnimationFrame(ease); })();
  KumiShell.mount({
    layout: 'bottom', theme: 'dark', font: 'roboto-mono', mono: 'roboto-mono', colors: { accent: '#f2e3c6', panel: 'rgba(10,10,12,0.66)' },
    daws: 'marks', dawsAt: 'kicker', dawColor: 'dim', dawSize: 18, line: 1, demoStyle: 'squares',
    headStyle: 'one', head: 35, sub: false, headSize: 80, after: 'then follow kumi’s guided setup',
    stage: 'self',
    onDaw: function (i) { if (a) a.form(i); },
    onDemo: function (i, d, video) { target = 1; if (a) a.flatten(video); },
    onRelease: function () { target = 0; if (a) a.release(); }
  });
})();
</script>
</body>
</html>
